name: Windows VST3 + Standalone
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build synthesizer
        run: cmake --build build --config Release --target Sonarium_VST3 Sonarium_Standalone --parallel 2
      - name: Compile and run DSP stress tests
        run: |
          cmake --build build --config Release --target sonarium_dsp_stress --parallel 2
          ctest --test-dir build -C Release --output-on-failure
      - name: Bundle VST3 for download
        shell: pwsh
        run: |
          $p = "build/Sonarium_artefacts/Release/VST3/Sonarium.vst3"
          if (!(Test-Path $p)) { throw "VST3 folder missing: $p" }
          Compress-Archive -Path $p -DestinationPath "Sonarium-Windows-VST3.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Sonarium-Windows-VST3
          path: Sonarium-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 14
